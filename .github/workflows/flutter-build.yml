name: Flutter Build CI

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # 👇 NEW: Decodes the Keystore back into a binary file
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks

      # 👇 NEW: Creates the properties file with your passwords for Gradle to read
      - name: Create key.properties
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
        
      - name: Build Debug APK (For local BlueStacks testing)
        run: flutter build apk --debug
        
      # 👇 NEW: Builds the secure, signed production bundle for Google Play
      - name: Build Release App Bundle
        run: flutter build appbundle
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rahisipay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rahisipay-release-aab
          path: build/app/outputs/bundle/release/app-release.aab