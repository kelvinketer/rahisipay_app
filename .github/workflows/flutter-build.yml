name: Flutter Build CI

on:
  push:
    branches: [ "main" ]

# Silences the warning and opts into the new Node 24 servers early
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        
      # 👇 1. Builds the APK for local testing (BlueStacks)
      - name: Build APK
        run: flutter build apk --debug
        
      # 👇 2. Builds the App Bundle for the Google Play Store
      - name: Build App Bundle
        run: flutter build appbundle
        
      # 👇 3. Uploads the APK to the GitHub dashboard
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rahisipay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # 👇 4. Uploads the AAB to the GitHub dashboard
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rahisipay-release-aab
          path: build/app/outputs/bundle/release/app-release.aab